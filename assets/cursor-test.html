<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>随引光标验证</title>
<style>
html,body{margin:0;height:100%;background:#fff;font:14px sans-serif}
#player{position:absolute;left:5%;top:12%;width:70%;height:65%;cursor:none;background:#000}
video,#layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:inherit}
#controls{position:absolute;bottom:0;left:0;right:0;height:36px;background:#eee;cursor:default}
a{display:inline-block;margin:10px;cursor:pointer}input{margin:10px;cursor:text}
</style></head>
<body>
<a href="#probe">链接</a><input value="文本">
<div id="player"><video src="demo.webm" playsinline preload="auto" muted></video><div id="layer"></div><div id="controls"></div></div>
</body></html>
