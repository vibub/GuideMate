<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>随引 B 站分集验证</title>
<style>
html,body{margin:0;height:100%;background:#122d24;color:white;font:14px sans-serif}
#episodes{padding:12px;display:flex;gap:8px}
.video-pod__item,.video-episode-card,li{padding:8px;cursor:pointer;list-style:none}
.active,.on{background:#177e69}
video{width:100%;height:80%;object-fit:contain}
</style>
<template id="modern">
  <div class="video-pod"><div class="video-pod__list multip list">
    <div data-key="101" class="simple-base-item video-pod__item normal"><div class="title"><div class="playing-gif" style="display:none"></div><div class="title-txt">第 1 集</div></div></div>
    <div data-key="102" class="simple-base-item video-pod__item normal"><div class="title"><div class="playing-gif" style="display:none"></div><div class="title-txt">第 2 集</div></div></div>
    <div data-key="103" class="simple-base-item video-pod__item normal"><div class="title"><div class="playing-gif" style="display:none"></div><div class="title-txt">第 3 集</div></div><a href="#unrelated">无关嵌入链接</a></div>
  </div></div>
</template>
<template id="legacy">
  <div class="video-sections-content-list">
    <div class="video-episode-card">第 1 集</div><div class="video-episode-card">第 2 集</div><div class="video-episode-card">第 3 集</div>
  </div>
</template>
<template id="multi">
  <div class="multi-page"><ul class="list-box"><li>第 1 集</li><li>第 2 集</li><li>第 3 集</li></ul></div>
</template>
<nav id="episodes"></nav>
<a rel="next" id="unrelated" href="#unrelated">无关链接</a>
<video src="demo.webm" controls muted preload="auto"></video>
<script>
const parameters = new URLSearchParams(location.search);
const layout = parameters.get('layout') || 'modern';
const root = document.getElementById('episodes');
root.append(document.getElementById(layout).content.cloneNode(true));
const items = [...root.querySelectorAll('.video-pod__item,.video-episode-card,li')];
if (parameters.get('hidden') === '1') root.style.display = 'none';
if (parameters.get('disabled') === '1') items[1].setAttribute('aria-disabled', 'true');
let selected = Number(parameters.get('p') || 1) - 1;
const select = index => {
  items.forEach((item, i) => {
    item.classList.toggle(layout === 'multi' ? 'on' : 'active', index === i);
    const gif = item.querySelector('.playing-gif');
    if (gif) gif.style.display = index === i ? '' : 'none';
  });
};
select(selected);
items.forEach((item, index) => item.addEventListener('click', () => {
  if (item.getAttribute('aria-disabled') === 'true') return;
  selected = index; select(index);
  parameters.set('p', String(index + 1));
  history.replaceState(null, '', '?' + parameters);
  const video = document.querySelector('video');
  video.pause(); video.currentTime = 0;
  document.title = '随引 B 站分集验证 ' + (index + 1);
}));
</script>
</html>
