<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>随引弹幕隔离测试</title>
<style>html,body{margin:0;width:100%;height:100%;background:#172821}video{width:100%;height:100%}</style></head>
<body><video src="demo.webm" controls playsinline preload="auto" muted></video>
<script>
const video = document.querySelector('video');
const renderer = {visible:true, manager:{visualArray:[], renderTime:0}};
window.player = {danmaku:{getDanmakuX:() => renderer, isOpen:() => renderer.visible}};
window.fixtureComments = () => {
  renderer.manager.renderTime = video.currentTime;
  renderer.manager.visualArray = [
    {textData:{dmid:'roll', stime:video.currentTime, text:'随引 · B 站弹幕铺满屏幕', size:30, color:0xffffff, mode:1}, showed:true, showTime:video.currentTime},
    {textData:{dmid:'top', stime:video.currentTime, text:'顶部弹幕 · 点击穿透', size:28, color:0x8ce6ff, mode:5}, showed:true, showTime:video.currentTime},
    {textData:{dmid:'bottom', stime:video.currentTime, text:'底部弹幕 · 保留小窗操作', size:28, color:0xffdc80, mode:4}, showed:true, showTime:video.currentTime},
    {textData:{dmid:'reverse', stime:video.currentTime, text:'反向滚动弹幕', size:26, color:0xb0ffc4, mode:6}, showed:true, showTime:video.currentTime}
  ];
};
setInterval(() => renderer.manager.renderTime = video.currentTime, 50);
</script></body></html>
